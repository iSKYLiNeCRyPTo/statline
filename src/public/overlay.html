<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fragr.live — Stream Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Transparent root — OBS browser source will show the game behind */
  html, body {
    background: transparent;
    font-family: 'Share Tech Mono', monospace;
    width: 100%;
    height: 100%;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Setup screen ───────────────────────────────────────────────── */
  #setup {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0a0a0f;
  }
  .setup-card {
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 36px 40px;
    width: 360px;
    text-align: center;
  }
  .setup-logo {
    font-size: 13px;
    color: #4fc3f7;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .setup-title {
    font-size: 20px;
    color: #e8e8f0;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .setup-sub {
    font-size: 11px;
    color: #666680;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .setup-input {
    width: 100%;
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    color: #e8e8f0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .setup-input:focus { border-color: #4fc3f7; }
  .setup-input::placeholder { color: #444460; }
  .setup-btn {
    width: 100%;
    background: #4fc3f7;
    color: #0a0a0f;
    border: none;
    border-radius: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    padding: 11px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .setup-btn:hover { background: #81d4fa; }
  .setup-btn:disabled { background: #2a2a3a; color: #444460; cursor: not-allowed; }
  .setup-err { font-size: 11px; color: #ff6b6b; margin-top: 10px; letter-spacing: 0.5px; }
  .setup-hint {
    font-size: 10px;
    color: #444460;
    margin-top: 20px;
    line-height: 1.6;
  }
  .setup-hint a { color: #4fc3f7; text-decoration: none; }

  /* ── Overlay widget ─────────────────────────────────────────────── */
  #overlay {
    display: none;
    padding: 0;
  }

  .widget {
    display: inline-flex;
    flex-direction: column;
    background: rgba(10, 10, 18, 0.82);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 16px 11px;
    min-width: 200px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    gap: 0;
  }

  /* Rank row */
  .rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rank-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
  }
  .rank-icon.hidden { display: none; }
  .rank-icon-fallback {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .rank-text { display: flex; flex-direction: column; }
  .rank-name {
    font-size: 15px;
    color: #e8e8f0;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .rank-csr {
    font-size: 10px;
    color: #888899;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* Divider */
  .divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 9px 0;
  }

  /* Session row */
  .session-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .session-label {
    font-size: 9px;
    color: #555570;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .session-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .session-wl {
    font-size: 12px;
    color: #ccccdd;
    letter-spacing: 0.5px;
  }
  .session-wins  { color: #4ade80; }
  .session-losses{ color: #f87171; }
  .session-sep   { color: #444460; font-size: 10px; }
  .session-csr-pos { font-size: 11px; color: #4ade80; letter-spacing: 0.5px; }
  .session-csr-neg { font-size: 11px; color: #f87171; letter-spacing: 0.5px; }
  .session-csr-neu { font-size: 11px; color: #888899; letter-spacing: 0.5px; }
  .session-none {
    font-size: 11px;
    color: #444460;
    letter-spacing: 0.5px;
  }

  /* Branding */
  .brand {
    font-size: 8px;
    color: #333350;
    letter-spacing: 1.5px;
    text-align: right;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Tier color accents on rank name */
  .tier-bronze   { color: #cd7f32; }
  .tier-silver   { color: #a8a9ad; }
  .tier-gold     { color: #ffd700; }
  .tier-platinum { color: #4fc3f7; }
  .tier-diamond  { color: #b9f2ff; }
  .tier-onyx     { color: #e040fb; }

  /* Status / loading */
  .status {
    font-size: 10px;
    color: #444460;
    letter-spacing: 0.5px;
    padding: 2px 0;
  }

  /* Pulse animation for refresh */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .refreshing .rank-name { animation: pulse 1s ease-in-out infinite; }
</style>
</head>
<body>

<!-- ── Setup Screen ──────────────────────────────────────────── -->
<div id="setup">
  <div class="setup-card">
    <div class="setup-logo">fragr.live</div>
    <div class="setup-title">STREAM OVERLAY</div>
    <div class="setup-sub">Enter your gamertag to set up your Halo stat widget for OBS / Streamlabs.</div>
    <input class="setup-input" id="gtInput" type="text" placeholder="Your Gamertag" maxlength="32" autocomplete="off" spellcheck="false">
    <button class="setup-btn" id="startBtn" onclick="startOverlay()">LOAD OVERLAY</button>
    <div class="setup-err" id="setupErr"></div>
    <div class="setup-hint">
      In OBS: <strong>Add &rarr; Browser Source</strong><br>
      Use this page URL + <code style="color:#4fc3f7">?gt=YourGamertag</code><br>
      Recommended size: <strong>280 &times; 100px</strong><br>
      Check <strong>"Transparent background"</strong> in OBS settings.
    </div>
  </div>
</div>

<!-- ── Overlay Widget ────────────────────────────────────────── -->
<div id="overlay">
  <div class="widget" id="widget">
    <div class="rank-row">
      <img class="rank-icon hidden" id="rankIcon" alt="rank">
      <div class="rank-icon-fallback" id="rankFallback">—</div>
      <div class="rank-text">
        <span class="rank-name" id="rankName">Loading...</span>
        <span class="rank-csr" id="rankCsr"></span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="session-row">
      <span class="session-label">SESSION</span>
      <div class="session-stats" id="sessionStats">
        <span class="session-none">No games yet</span>
      </div>
    </div>
    <div class="brand">fragr.live</div>
  </div>
</div>

<script>
// ── Tier config ───────────────────────────────────────────────────────────────
const TIER_COLORS = {
  bronze:'tier-bronze', silver:'tier-silver', gold:'tier-gold',
  platinum:'tier-platinum', diamond:'tier-diamond', onyx:'tier-onyx'
};
const TIER_EMOJI = {
  bronze:'🥉', silver:'🥈', gold:'🥇',
  platinum:'💎', diamond:'💠', onyx:'⬛'
};

let _gamertag = '';
let _refreshTimer = null;
let _lastRankStr = '';

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  const params = new URLSearchParams(location.search);
  const gt = params.get('gt') || params.get('gamertag') || localStorage.getItem('overlay_gt') || '';
  if (gt) {
    _gamertag = gt.trim();
    showOverlay();
    load();
  }
})();

function startOverlay() {
  const val = document.getElementById('gtInput').value.trim();
  if (!val) { showErr('Enter your gamertag'); return; }
  _gamertag = val;
  localStorage.setItem('overlay_gt', val);
  showErr('');
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'LOADING...';
  showOverlay();
  load();
}

document.getElementById('gtInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startOverlay();
});

function showOverlay() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('overlay').style.display = 'block';
}

function showErr(msg) {
  document.getElementById('setupErr').textContent = msg;
}

// ── Data fetch ────────────────────────────────────────────────────────────────
async function load() {
  if (!_gamertag) return;
  try {
    const r = await fetch(`/api/search?gamertag=${encodeURIComponent(_gamertag)}`);
    const data = await r.json();
    if (!data.success || !data.player) {
      setError('Player not found');
      scheduleRefresh();
      return;
    }
    render(data.player);
  } catch(e) {
    setError('Connection error');
  }
  scheduleRefresh();
}

function scheduleRefresh() {
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(load, 60000); // refresh every 60s
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(player) {
  renderRank(player);
  renderSession(player);
}

function renderRank(player) {
  // csr is keyed by playlist display name e.g. "Ranked Arena"
  // Each entry: { tier, subTier, value, display }
  const csrObj = player.csr;
  let rankStr = null, csrVal = null, tierKey = null;

  if (csrObj && typeof csrObj === 'object') {
    const keys = Object.keys(csrObj);
    // Prefer a key with "rank" in the name, else take the first
    const rankedKey = keys.find(k => /rank/i.test(k)) || keys[0];
    const entry = csrObj[rankedKey];
    if (entry) {
      // entry.display is already formatted e.g. "Diamond 4" or "Onyx 1654"
      rankStr = entry.display || (entry.tier ? `${entry.tier} ${entry.subTier || ''}`.trim() : null);
      if (entry.tier === 'Onyx') {
        csrVal = entry.value != null ? `${entry.value} CSR` : null;
      } else {
        csrVal = entry.value != null ? `${entry.value} CSR` : null;
      }
      tierKey = (entry.tier || '').toLowerCase();
    }
  }

  const rankNameEl = document.getElementById('rankName');
  const rankCsrEl  = document.getElementById('rankCsr');
  const iconEl     = document.getElementById('rankIcon');
  const fallbackEl = document.getElementById('rankFallback');

  if (!rankStr) {
    rankNameEl.textContent = 'Unranked';
    rankNameEl.className = 'rank-name';
    rankCsrEl.textContent = '';
    iconEl.classList.add('hidden');
    fallbackEl.textContent = '—';
    fallbackEl.style.display = 'flex';
    return;
  }

  // Set name + color
  rankNameEl.textContent = rankStr.toUpperCase();
  rankNameEl.className = 'rank-name ' + (TIER_COLORS[tierKey] || '');
  rankCsrEl.textContent = csrVal || '';

  // Try to load rank icon image
  if (tierKey) {
    iconEl.src = `/api/csr-image?tier=${encodeURIComponent(tierKey)}`;
    iconEl.onload = () => {
      iconEl.classList.remove('hidden');
      fallbackEl.style.display = 'none';
    };
    iconEl.onerror = () => {
      iconEl.classList.add('hidden');
      fallbackEl.textContent = TIER_EMOJI[tierKey] || '🎮';
      fallbackEl.style.display = 'flex';
    };
  }
}

function renderSession(player) {
  const sessionEl = document.getElementById('sessionStats');
  const matches = player.allMatches || player.recentMatches || [];

  // Filter to today's matches (UTC day boundary)
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);

  const todayMatches = matches.filter(m => {
    if (!m.startTime) return false;
    return new Date(m.startTime) >= todayStart;
  });

  // Also compute "session" as last N ranked games regardless of day
  const rankedSession = matches.filter(m => m.isRanked).slice(0, 20);

  // Prefer today's games; fallback to last 10 ranked if today is empty
  const sessionMatches = todayMatches.length > 0
    ? todayMatches
    : rankedSession.slice(0, 10);

  const isToday = todayMatches.length > 0;

  if (!sessionMatches.length) {
    sessionEl.innerHTML = '<span class="session-none">No games yet</span>';
    return;
  }

  const ranked = sessionMatches.filter(m => m.isRanked);
  const wins   = sessionMatches.filter(m => m.outcome === 2).length;
  const losses = sessionMatches.filter(m => m.outcome === 3).length;
  const totalGames = sessionMatches.length;

  // CSR delta — sum all csrDelta values from ranked games
  let csrDelta = null;
  if (ranked.length > 0) {
    const deltas = ranked.map(m => m.csrDelta).filter(d => d != null);
    if (deltas.length > 0) csrDelta = deltas.reduce((s, d) => s + d, 0);
  }

  const prefix = isToday ? '' : 'LAST ';
  let html = '';

  // W / L
  html += `<span class="session-label" style="color:#33335a">${prefix}${totalGames}G</span>`;
  html += `<span class="session-wins">${wins}W</span>`;
  html += `<span class="session-sep">-</span>`;
  html += `<span class="session-losses">${losses}L</span>`;

  // CSR delta
  if (csrDelta != null) {
    const sign = csrDelta > 0 ? '+' : '';
    const cls  = csrDelta > 0 ? 'session-csr-pos' : csrDelta < 0 ? 'session-csr-neg' : 'session-csr-neu';
    html += `<span class="session-sep">·</span>`;
    html += `<span class="${cls}">${sign}${csrDelta} CSR</span>`;
  }

  sessionEl.innerHTML = html;
}

function setError(msg) {
  document.getElementById('rankName').textContent = msg;
  document.getElementById('rankName').className = 'rank-name';
  document.getElementById('rankCsr').textContent = '';
  document.getElementById('sessionStats').innerHTML = '<span class="session-none">—</span>';
}
</script>
</body>
</html>
